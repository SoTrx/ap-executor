services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/python:3.14-trixie
    volumes:
      - ../..:/workspaces:cached
    #    network_mode: service:db
    command: sleep infinity
    environment:
      - CONSUL_HTTP_ADDR=http://executor-consul:8500
      - DAPR_HTTP_PORT=3500
      - DAPR_GRPC_PORT=50001
    depends_on:
      executor-consul:
        condition: service_healthy

  # --- Redis Service (Dapr actor/workflow state store backend) ---
  executor-redis:
    image: redis:8-alpine
    container_name: executor-redis
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Consul (service registry for operator discovery) ---
  executor-consul:
    image: hashicorp/consul:2.0
    container_name: executor-consul
    command: agent -dev -client=0.0.0.0 -ui
    # ports:
    #   - "8500:8500" # HTTP API / UI
    #   - "8600:8600/udp" # DNS
    restart: always
    healthcheck:
      test: [ "CMD", "consul", "members" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Dapr placement service (actor placement, required by Dapr Workflow) ---
  executor-dapr-placement:
    image: daprio/dapr:1.18.2
    container_name: executor-dapr-placement
    command: [ "./placement", "--port", "50005", "--log-level", "info" ]
    restart: always

  # --- Dapr scheduler service (job/timer scheduling backend for Dapr
  # Workflow since Dapr 1.15 — daprd disables its scheduler client and
  # workflow instance creation fails without one) ---
  executor-dapr-scheduler:
    image: daprio/dapr:1.18.2
    container_name: executor-dapr-scheduler
    command: [ "./scheduler", "--port", "50006", "--log-level", "info", "--etcd-data-dir", "/tmp/dapr-scheduler-data" ]
    restart: always

  # --- Dapr sidecar for the ap-executor app ---
  executor-daprd:
    image: daprio/daprd:1.18.2
    container_name: executor-daprd
    command:
      - "./daprd"
      - "-app-id=ap-executor"
      - "-app-port=5000"
      - "-app-protocol=http"
      - "-dapr-http-port=3500"
      - "-dapr-grpc-port=50001"
      - "-placement-host-address=executor-dapr-placement:50005"
      - "-scheduler-host-address=executor-dapr-scheduler:50006"
      - "-resources-path=/components"
    volumes:
      - ../.dapr/components:/components
    # Shares the devcontainer's network namespace so the app can reach it at
    # localhost, matching Dapr's standard self-hosted colocation pattern.
    network_mode: "service:devcontainer"
    restart: always
    depends_on:
      executor-dapr-placement:
        condition: service_started
      executor-dapr-scheduler:
        condition: service_started
      executor-redis:
        condition: service_healthy
