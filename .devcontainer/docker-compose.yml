services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/python:3.14-trixie
    volumes:
      - ../..:/workspaces:cached
    #    network_mode: service:db
    command: sleep infinity
    environment:
      - CONSUL_HTTP_ADDR=http://executor-consul:8500
      - DAPR_HTTP_PORT=3500
      - DAPR_GRPC_PORT=50001
    depends_on:
      executor-consul:
        condition: service_healthy

  # --- Redis Service (Dapr actor/workflow state store backend) ---
  executor-redis:
    image: redis:8-alpine
    container_name: executor-redis
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Consul (service registry for operator discovery) ---
  executor-consul:
    image: hashicorp/consul:2.0
    container_name: executor-consul
    command: agent -dev -client=0.0.0.0 -ui
    # ports:
    #   - "8500:8500" # HTTP API / UI
    #   - "8600:8600/udp" # DNS
    restart: always
    healthcheck:
      test: [ "CMD", "consul", "members" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Dapr placement service (actor placement, required by Dapr Workflow) ---
  executor-dapr-placement:
    image: daprio/dapr:1.18.2
    container_name: executor-dapr-placement
    command: [ "./placement", "--port", "50005", "--log-level", "info" ]
    restart: always

  # --- Dapr scheduler service (job/timer scheduling backend for Dapr
  # Workflow since Dapr 1.15 — daprd disables its scheduler client and
  # workflow instance creation fails without one) ---
  executor-dapr-scheduler:
    image: daprio/dapr:1.18.2
    container_name: executor-dapr-scheduler
    command: [ "./scheduler", "--port", "50006", "--log-level", "info", "--etcd-data-dir", "/tmp/dapr-scheduler-data" ]
    restart: always

  # --- Dapr sidecar for the ap-executor app ---
  executor-daprd:
    image: daprio/daprd:1.18.2
    container_name: executor-daprd
    command:
      - "./daprd"
      - "-app-id=ap-executor"
      - "-app-port=5000"
      - "-app-protocol=http"
      - "-dapr-http-port=3500"
      - "-dapr-grpc-port=50001"
      - "-placement-host-address=executor-dapr-placement:50005"
      - "-scheduler-host-address=executor-dapr-scheduler:50006"
      - "-resources-path=/components"
    volumes:
      - ../.dapr/components:/components
    # Shares the devcontainer's network namespace so the app can reach it at
    # localhost, matching Dapr's standard self-hosted colocation pattern.
    network_mode: "service:devcontainer"
    restart: always
    depends_on:
      executor-dapr-placement:
        condition: service_started
      executor-dapr-scheduler:
        condition: service_started
      executor-redis:
        condition: service_healthy

  # --- Operator sidecar dev/example services -----------------------------
  # Opt-in only (`docker compose --profile sidecar-dev up`): there's no real
  # operator container in this repo, so `executor-sidecar-dummy-operator`
  # (sidecar/examples/dummy_operator.py) exists purely so the sidecar's
  # proxy + Consul registration can be smoke-tested end-to-end locally. A
  # real operator deployment runs the `sidecar` Docker image (see
  # ../Dockerfile's `sidecar` stage) next to its OWN operator container
  # instead of this dummy one.
  executor-sidecar-dummy-operator:
    build:
      context: ..
      dockerfile: Dockerfile
      target: builder
    container_name: executor-sidecar-dummy-operator
    command: [ "uv", "run", "fastapi", "run", "sidecar/examples/dummy_operator.py", "--port", "9000" ]
    restart: always
    profiles: [ "sidecar-dev" ]

  executor-sidecar:
    build:
      context: ..
      dockerfile: Dockerfile
      target: sidecar
    container_name: executor-sidecar
    environment:
      - CONSUL_HTTP_ADDR=http://executor-consul:8500
      - SIDECAR_SERVICE_NAME=Text to SQL
      - SIDECAR_ADVERTISE_ADDRESS=executor-sidecar
      - SIDECAR_PORT=8000
      - UPSTREAM_HOST=executor-sidecar-dummy-operator
      - UPSTREAM_PORT=9000
      - OPERATOR_NAME=Text to SQL
      - OPERATOR_VERSION=1.0.0
      - OPERATOR_EXECUTION={"mode":"sync","protocol":"http","endpoint":"/execute"}
      - OPERATOR_INPUTS=[{"name":"nl","type":"string","required":true}]
      - OPERATOR_OUTPUTS=[{"name":"query","type":"string","required":true}]
    depends_on:
      executor-consul:
        condition: service_healthy
      executor-sidecar-dummy-operator:
        condition: service_started
    restart: always
    profiles: [ "sidecar-dev" ]
