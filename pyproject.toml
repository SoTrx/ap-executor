[project]
name = "ap-executor"
version = "0.1.0"
description = "AP Executor – execute Analytical Pattern operators step by step"
authors = [{ name = "DataGems EOSC" }]
readme = "README.md"
keywords = ["python", "analytical-patterns", "executor"]
requires-python = ">=3.14,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi[standard]>=0.128.0",
    "pydantic>=2.12.5",
    "orjson>=3.10.0",
    "python-dotenv>=1.1.0",
    "httpx>=0.27.0",
    "dapr>=1.18.0,<2.0.0",
    "dapr-ext-workflow>=1.18.0,<2.0.0",
    "uvicorn>=0.41.0",
    "moma-domain>=2.9.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.55.0"]

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
    "neoteroi-mkdocs>=1.2.0",
    "pymdown-extensions>=10.20",
    "mike>=2.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools]
py-modules = ["ap_executor"]

[tool.hatch.build.targets.wheel]
packages = ["ap_executor", "sidecar", "magic_operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: exercises the full docker-compose stack over real HTTP; excluded from the default run (see docs/docs/development.md)",
]

[tool.uv.sources]
moma-domain = { url = "https://github.com/datagems-eosc/moma-management/releases/download/v2.9.0/moma_domain-2.9.0-py3-none-any.whl" }
