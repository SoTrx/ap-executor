# magic_operator's own declaration for "Magic Combine". Mounted read-only
# into e2e-magic-c, path given via MAGIC_OPERATOR_CONFIG_PATH. execution_mode
# must stay consistent with manifest.yaml's execution.endpoint in this same
# directory (sync_http here means "serves POST /execute").
name: Magic Combine
execution_mode: sync_http
output_name: message
prompt_template: "Write a message summarizing '{summary}' in a '{tone}' tone."
inputs:
  - name: summary
    type: string
    required: true
  - name: tone
    type: string
    required: true
