# magic_operator's own declaration for "Magic Echo B". Mounted read-only into
# e2e-magic-b, path given via MAGIC_OPERATOR_CONFIG_PATH. execution_mode
# must stay consistent with manifest.yaml's execution.start_endpoint/
# poll_endpoint in this same directory (async_http here means "serves
# POST /jobs + GET /jobs/{id}").
name: Magic Echo B
execution_mode: async_http
output_name: tone
prompt_template: "Pick a tone of voice for the audience: {audience}"
inputs:
  - name: audience
    type: string
    required: true
