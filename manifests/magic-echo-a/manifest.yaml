# Sidecar-facing OperatorManifest for "Magic Echo A" (sync_http producer:
# topic -> summary). Mounted read-only into e2e-sidecar-a, path given via
# OPERATOR_MANIFEST_PATH. Must stay consistent with
# magic-operator.yaml's execution_mode in this same directory.
manifest_version: "0.1.0"
operator: Magic Echo A
version: "1.0.0"
execution:
  mode: sync
  protocol: http
  endpoint: /execute
inputs:
  - name: topic
    type: string
    required: true
outputs:
  - name: summary
    type: string
    required: true
