name: E2E Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (host-side test runner)
        run: uv sync --all-groups

      - name: Build and start the e2e stack
        run: docker compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for executor readiness + operator registration
        run: uv run python scripts/wait_for_e2e_stack.py

      - name: Run e2e tests
        run: uv run pytest tests/e2e -m e2e

      - name: Collect compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
