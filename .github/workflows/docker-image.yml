name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/sotrx/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag

      - name: Extract metadata (tags, labels) for the magic_operator image
        id: meta-magic-operator
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/sotrx/${{ env.IMAGE_NAME }}
          flavor: suffix=-magic-operator,onlatest=false
          tags: |
            type=ref,event=tag

      - name: Build testing Docker image
        id: build-test
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          target: test
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run tests
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ${{ steps.build-test.outputs.imageid }}

      - name: Build and push production Docker image
        id: build-prod
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          target: prod
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push magic_operator Docker image
        id: build-magic-operator
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.meta-magic-operator.outputs.tags }}
          target: magic-operator
          labels: ${{ steps.meta-magic-operator.outputs.labels }}
